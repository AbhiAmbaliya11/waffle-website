<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFB936" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Decorative Waffle Shape Background -->
  <rect x="10" y="10" width="380" height="100" rx="20" fill="#1A0903" stroke="url(#goldGradient)" stroke-width="2" />
  
  <!-- Stylized Text -->
  <text x="50%" y="45" text-anchor="middle" fill="url(#goldGradient)" font-family="Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="2" style="text-transform: uppercase; filter: url(#glow);">Connect with Waffle Castle</text>
  
  <!-- Social Icons Representational Shapes (Placeholder circles for high-end look) -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="18" fill="rgba(255, 185, 54, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="url(#goldGradient)" stroke-width="2" /> <!-- Representative Icon -->
  </g>
  <g transform="translate(150, 70)">
    <circle cx="0" cy="0" r="18" fill="rgba(255, 185, 54, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <rect x="-6" y="-6" width="12" height="12" rx="2" stroke="url(#goldGradient)" stroke-width="2" />
  </g>
  <g transform="translate(200, 70)">
    <circle cx="0" cy="0" r="18" fill="rgba(255, 185, 54, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <path d="M-7 0 L7 0 M0 -7 L0 7" stroke="url(#goldGradient)" stroke-width="2" />
  </g>
  <g transform="translate(250, 70)">
    <circle cx="0" cy="0" r="18" fill="rgba(255, 185, 54, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <path d="M-6 -4 L6 -4 L0 6 Z" fill="url(#goldGradient)" />
  </g>
  <g transform="translate(300, 70)">
    <circle cx="0" cy="0" r="18" fill="rgba(255, 185, 54, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5" />
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="url(#goldGradient)" stroke-width="2" />
  </g>
</svg>
